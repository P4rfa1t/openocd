#
# NOTE: the nds32 target backend is not in this tree. It was imported from
# andestech/nds-openocd but dropped afterwards because it targets a
# target_type interface that has since moved on, so "target create" below
# cannot resolve the type. The file is kept so the failure is a readable
# message here rather than a missing-file error higher up.

error "nds32 target backend is not built in this tree; chip support for Andes cores is unavailable"

jtag newtap $_CHIPNAME cpu -expected-id $_CPUTAPID

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME nds32_v3m -endian little -chain-position $_TARGETNAME
