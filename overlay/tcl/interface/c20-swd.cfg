source [find interface/raspberrypi-native.cfg]

# Each of the SWD lines need a gpio number set: swclk swdio
# Header pin numbers: 23 22
adapter gpio swclk -chip 0 16
adapter gpio swdio -chip 0 20
adapter gpio swdio_dir -chip 0 21 -active-low
adapter gpio swdio_in -chip 0 12

adapter speed 1000
