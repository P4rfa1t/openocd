# This is upstream openocd-org/openocd's .github/workflows/snapshot.yml with the
# minimum changes needed to build a standalone Windows package from this fork.
#
# Deviations from upstream, and why:
#
#  * upstream packages an i686 (32-bit) build; this fork targets x86_64, so
#    HOST is x86_64-w64-mingw32 and g++-mingw-w64-x86-64 replaces ...-i686.
#  * upstream also creates a GitHub Release and deletes the previous 'latest'
#    one. This fork keeps the Release but changes when it happens: the release
#    job runs only for a pushed v* tag (see the 'release' job below), and the
#    'latest' juggling is dropped - fork releases are numbered v0.12.0-fork.N
#    and must stay addressable by tag.
#  * trigger is workflow_dispatch + push instead of upstream's bare `on: push`,
#    so a run can be started by hand without a commit.
#
# Two jobs were added on top of upstream's single package job:
#
#  * gate   - runs the repository's own integrity checks: verify_tree.py,
#             sync_doc_numbers.py --check and check_tcl_syntax.py, so a commit
#             that leaves the manifest stale, a published number drifting or a
#             configuration unparsable fails CI instead of rotting. The
#             dangling-reference scan runs last for the log; it is advisory
#             because five known-harmless references are expected.
#  * release - only for a pushed v* tag: it takes the package job's artifact and
#             creates the GitHub Release with gh, which is preinstalled on the
#             runner. The release therefore needs no local gh, no token and no
#             manual upload.
#
# Everything else - the download list, all versions, every *_CONFIG, the
# cross-build.sh invocation and the DLL fix-ups - is upstream's, unchanged.

on:
  push:
  workflow_dispatch:

name: OpenOCD Snapshot

jobs:
  package:
    runs-on: [ubuntu-latest]
    env:
      DL_DIR: ../downloads
      BUILD_DIR: ../build
    steps:
      - name: Install needed packages
        run: |
          sudo apt-get update
          sudo apt-get install autotools-dev autoconf automake libtool pkg-config cmake texinfo texlive g++-mingw-w64-x86-64
      - name: Checkout Code
        uses: actions/checkout@v4
        # Upstream does not pass --recursive here; it builds its own jimtcl from
        # a pinned tarball below (JIMTCL_VER). The jimtcl gitlink in this tree is
        # therefore unused by this job - the submodule is deliberately not
        # fetched, so the build uses exactly the jimtcl upstream CI uses.
      - run: ./bootstrap
      - name: Prepare libusb1
        env:
          LIBUSB1_VER: 1.0.26
        run: |
          mkdir -p $DL_DIR && cd $DL_DIR
          wget "https://github.com/libusb/libusb/releases/download/v${LIBUSB1_VER}/libusb-${LIBUSB1_VER}.tar.bz2"
          tar -xjf libusb-${LIBUSB1_VER}.tar.bz2
          echo "LIBUSB1_SRC=$PWD/libusb-${LIBUSB1_VER}" >> $GITHUB_ENV
      - name: Prepare hidapi
        env:
          HIDAPI_VER: 0.13.1
        run: |
          mkdir -p $DL_DIR && cd $DL_DIR
          wget "https://github.com/libusb/hidapi/archive/hidapi-${HIDAPI_VER}.tar.gz"
          tar -xzf hidapi-${HIDAPI_VER}.tar.gz
          cd hidapi-hidapi-${HIDAPI_VER}
          ./bootstrap
          echo "HIDAPI_SRC=$PWD" >> $GITHUB_ENV
      - name: Prepare libftdi
        env:
          LIBFTDI_VER: 1.5
        run: |
          mkdir -p $DL_DIR && cd $DL_DIR
          wget "http://www.intra2net.com/en/developer/libftdi/download/libftdi1-${LIBFTDI_VER}.tar.bz2"
          tar -xjf libftdi1-${LIBFTDI_VER}.tar.bz2
          echo "LIBFTDI_SRC=$PWD/libftdi1-${LIBFTDI_VER}" >> $GITHUB_ENV
      - name: Prepare capstone
        env:
          CAPSTONE_VER: 4.0.2
        run: |
          mkdir -p $DL_DIR && cd $DL_DIR
          CAPSTONE_NAME=${CAPSTONE_VER}
          CAPSTONE_FOLDER=capstone-${CAPSTONE_VER}
          wget "https://github.com/aquynh/capstone/archive/${CAPSTONE_VER}.tar.gz"
          tar -xzf ${CAPSTONE_VER}.tar.gz
          echo "CAPSTONE_SRC=$PWD/capstone-${CAPSTONE_VER}" >> $GITHUB_ENV
      - name: Prepare libjaylink
        env:
          LIBJAYLINK_VER: 0.3.1
        run: |
          mkdir -p $DL_DIR && cd $DL_DIR
          wget https://gitlab.zapb.de/libjaylink/libjaylink/-/archive/${LIBJAYLINK_VER}/libjaylink-${LIBJAYLINK_VER}.tar.gz
          tar -xzf libjaylink-${LIBJAYLINK_VER}.tar.gz
          cd libjaylink-${LIBJAYLINK_VER}
          ./autogen.sh
          echo "LIBJAYLINK_SRC=$PWD" >> $GITHUB_ENV
      - name: Prepare jimtcl
        env:
          JIMTCL_VER: 0.83
        run: |
          mkdir -p $DL_DIR && cd $DL_DIR
          wget https://github.com/msteveb/jimtcl/archive/refs/tags/${JIMTCL_VER}.tar.gz
          tar -xzf ${JIMTCL_VER}.tar.gz
          echo "JIMTCL_SRC=$PWD/jimtcl-${JIMTCL_VER}" >> $GITHUB_ENV
      - name: Prepare libyaml
        env:
          LIBYAML_VER: 0.2.5
        run: |
          mkdir -p $DL_DIR && cd $DL_DIR
          # The release tarball ships a pre-generated configure script and
          # config/config.guess, so no autoreconf run is needed here.  The
          # git tag archive would need ./bootstrap first.
          wget "https://github.com/yaml/libyaml/releases/download/${LIBYAML_VER}/yaml-${LIBYAML_VER}.tar.gz"
          tar -xzf yaml-${LIBYAML_VER}.tar.gz
          echo "LIBYAML_SRC=$PWD/yaml-${LIBYAML_VER}" >> $GITHUB_ENV
      - name: Prepare zlib
        env:
          ZLIB_VER: 1.3.1
        run: |
          mkdir -p $DL_DIR && cd $DL_DIR
          wget "https://github.com/madler/zlib/releases/download/v${ZLIB_VER}/zlib-${ZLIB_VER}.tar.gz"
          tar -xzf zlib-${ZLIB_VER}.tar.gz
          echo "ZLIB_SRC=$PWD/zlib-${ZLIB_VER}" >> $GITHUB_ENV
      - name: Package OpenOCD for windows
        env:
          MAKE_JOBS: 2
          HOST: x86_64-w64-mingw32
          LIBUSB1_CONFIG: --enable-shared --disable-static
          HIDAPI_CONFIG: --enable-shared --disable-static --disable-testgui
          LIBFTDI_CONFIG: -DSTATICLIBS=OFF -DEXAMPLES=OFF -DFTDI_EEPROM=OFF
          CAPSTONE_CONFIG: "CAPSTONE_BUILD_CORE_ONLY=yes CAPSTONE_STATIC=yes CAPSTONE_SHARED=no"
          LIBJAYLINK_CONFIG: --enable-shared --disable-static
          JIMTCL_CONFIG: --with-ext=json --minimal --disable-ssl
          LIBYAML_CONFIG: ""
        run: |
          # check if there is tag pointing at HEAD, otherwise take the HEAD SHA-1 as OPENOCD_TAG
          OPENOCD_TAG="`git tag --points-at HEAD`"
          [ -z $OPENOCD_TAG ] && OPENOCD_TAG="`git rev-parse --short HEAD`"
          # set env and call cross-build.sh
          export OPENOCD_TAG=$OPENOCD_TAG
          export OPENOCD_SRC=$PWD
          # Enable the adapters contributed by merged third-party forks.
          # Option names come from configure.ac's AC_ARG_ADAPTERS/
          # PROCESS_ADAPTERS macros, which m4_translit underscores to dashes,
          # so adi_ice1000 becomes --enable-adi-ice1000.
          # ADI_* need libusb-1.x; adi-usbmux only builds on Win32 hosts
          # (it is #ifdef _WIN32 throughout) and this job targets mingw.
          export OPENOCD_CONFIG="--enable-dirtyjtag --enable-adi-ice1000 --enable-adi-ice1500 --enable-adi-dbgagent --enable-adi-mpdbgagent --enable-adi-usbmux"
          mkdir -p $BUILD_DIR &&  cd $BUILD_DIR
          bash $OPENOCD_SRC/contrib/cross-build.sh $HOST
          # add missing dlls
          cd $HOST-root/usr
          cp `$HOST-gcc --print-file-name=libwinpthread-1.dll` ./bin/
          # required by libftdi1.dll
          cp `$HOST-gcc --print-file-name=libgcc_s_seh-1.dll` ./bin/
          # prepare the artifact
          ARTIFACT="openocd-${OPENOCD_TAG}-${HOST}.tar.gz"
          tar -czf $ARTIFACT *
          echo "ARTIFACT_PATH=$PWD/$ARTIFACT" >> $GITHUB_ENV
      - name: Publish OpenOCD packaged for windows
        uses: actions/upload-artifact@v4
        with:
          name: openocd-windows
          path: ${{ env.ARTIFACT_PATH }}

  # The repository ships its own gates; run them here so a stale manifest or a
  # stale published number is a CI failure rather than a silent regression.
  gate:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install a TCL interpreter
        run: sudo apt-get update && sudo apt-get install -y tcl
      - name: Fetch the pinned upstream branch when it is reachable
        # sync_doc_numbers.py prefers the real upstream tree over the committed
        # index; without this step it falls back to manifest/upstream-index.txt,
        # which is fine but weaker. A network failure must not fail the gate.
        continue-on-error: true
        run: |
          git remote add upstream https://github.com/openocd-org/openocd.git
          git fetch --no-tags --depth 1 upstream master:refs/remotes/upstream/master
      - name: Verify the imported overlay against manifest/PROVENANCE.json
        run: python3 tools/verify_tree.py
      - name: Check every published number for drift
        run: python3 tools/sync_doc_numbers.py --check
      - name: Parse every shipped TCL configuration
        run: python3 tools/check_tcl_syntax.py
      - name: Report dangling [find ...] references without failing on the known five
        run: python3 tools/audit_dangling_refs.py

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [ubuntu-latest]
    permissions:
      contents: write
    steps:
      - name: Download the windows package
        uses: actions/download-artifact@v4
        with:
          name: openocd-windows
      - name: Create or update the GitHub Release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh cannot discover the repository from a
          # git remote; name it explicitly or every gh call fails.
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A re-run of the same tag: replace the asset instead of failing.
            gh release upload "$GITHUB_REF_NAME" ./openocd-*.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./openocd-*.tar.gz \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes
          fi
