# SPDX-License-Identifier: GPL-2.0-or-later

# This is upstream openocd-org/openocd's .github/workflows/snapshot.yml with the
# minimum changes needed to build a standalone Windows package from this fork.
#
# Deviations from upstream, and why:
#
#  * upstream packages an i686 (32-bit) build; this fork targets x86_64, so
#    HOST is x86_64-w64-mingw32 and g++-mingw-w64-x86-64 replaces ...-i686.
#  * upstream also creates a GitHub Release and deletes the previous 'latest'
#    one. This fork keeps the Release but changes when it happens: the release
#    job runs only for a pushed v* tag (see the 'release' job below), and the
#    'latest' juggling is dropped - fork releases are numbered v0.12.0-fork.N
#    and must stay addressable by tag.
#  * trigger is workflow_dispatch + push instead of upstream's bare `on: push`,
#    so a run can be started by hand without a commit.
#
# Three jobs were added or reshaped on top of upstream's package job:
#
#  * package-linux - a native x86_64 Linux build of the same feature set,
#             installed into one relocatable tree and published as
#             openocd-linux. Upstream has no Linux job at all.
#  * gate   - runs the repository's own integrity checks: verify_tree.py,
#             sync_doc_numbers.py --check, check_tcl_syntax.py and
#             audit_flash_drivers.py, so a commit that leaves the manifest stale,
#             a published number drifting, a configuration unparsable or a
#             `flash bank` naming an uncompiled driver fails CI instead of
#             rotting. The dangling-reference scan runs last for the log; it is
#             advisory because five known-harmless references are expected.
#  * release - only for a pushed v* tag: it takes both package jobs' artifacts
#             and creates the GitHub Release with gh, which is preinstalled on
#             the runner. The release therefore needs no local gh, no token and
#             no manual upload.
#
# Everything else - the download list, all versions, every *_CONFIG, the
# cross-build.sh invocation and the DLL fix-ups - is upstream's, unchanged.
# The Linux job is the one place that does not reuse upstream's recipe, because
# upstream has none to reuse: it links against the distribution's -dev packages
# and copies the non-glibc libraries into the package itself.

on:
  push:
  workflow_dispatch:

name: OpenOCD Snapshot

jobs:
  package:
    runs-on: [ubuntu-latest]
    env:
      DL_DIR: ../downloads
      BUILD_DIR: ../build
    steps:
      - name: Install needed packages
        run: |
          sudo apt-get update
          sudo apt-get install autotools-dev autoconf automake libtool pkg-config cmake texinfo texlive g++-mingw-w64-x86-64
      - name: Checkout Code
        uses: actions/checkout@v4
        # Upstream does not pass --recursive here; it builds its own jimtcl from
        # a pinned tarball below (JIMTCL_VER). The jimtcl gitlink in this tree is
        # therefore unused by this job - the submodule is deliberately not
        # fetched, so the build uses exactly the jimtcl upstream CI uses.
      - run: ./bootstrap
      - name: Prepare libusb1
        env:
          LIBUSB1_VER: 1.0.26
        run: |
          mkdir -p $DL_DIR && cd $DL_DIR
          wget "https://github.com/libusb/libusb/releases/download/v${LIBUSB1_VER}/libusb-${LIBUSB1_VER}.tar.bz2"
          tar -xjf libusb-${LIBUSB1_VER}.tar.bz2
          echo "LIBUSB1_SRC=$PWD/libusb-${LIBUSB1_VER}" >> $GITHUB_ENV
      - name: Prepare hidapi
        env:
          HIDAPI_VER: 0.13.1
        run: |
          mkdir -p $DL_DIR && cd $DL_DIR
          wget "https://github.com/libusb/hidapi/archive/hidapi-${HIDAPI_VER}.tar.gz"
          tar -xzf hidapi-${HIDAPI_VER}.tar.gz
          cd hidapi-hidapi-${HIDAPI_VER}
          ./bootstrap
          echo "HIDAPI_SRC=$PWD" >> $GITHUB_ENV
      - name: Prepare libftdi
        env:
          LIBFTDI_VER: 1.5
        run: |
          mkdir -p $DL_DIR && cd $DL_DIR
          wget "http://www.intra2net.com/en/developer/libftdi/download/libftdi1-${LIBFTDI_VER}.tar.bz2"
          tar -xjf libftdi1-${LIBFTDI_VER}.tar.bz2
          echo "LIBFTDI_SRC=$PWD/libftdi1-${LIBFTDI_VER}" >> $GITHUB_ENV
      - name: Prepare capstone
        env:
          CAPSTONE_VER: 4.0.2
        run: |
          mkdir -p $DL_DIR && cd $DL_DIR
          CAPSTONE_NAME=${CAPSTONE_VER}
          CAPSTONE_FOLDER=capstone-${CAPSTONE_VER}
          wget "https://github.com/aquynh/capstone/archive/${CAPSTONE_VER}.tar.gz"
          tar -xzf ${CAPSTONE_VER}.tar.gz
          echo "CAPSTONE_SRC=$PWD/capstone-${CAPSTONE_VER}" >> $GITHUB_ENV
      - name: Prepare libjaylink
        env:
          LIBJAYLINK_VER: 0.3.1
        run: |
          mkdir -p $DL_DIR && cd $DL_DIR
          wget https://gitlab.zapb.de/libjaylink/libjaylink/-/archive/${LIBJAYLINK_VER}/libjaylink-${LIBJAYLINK_VER}.tar.gz
          tar -xzf libjaylink-${LIBJAYLINK_VER}.tar.gz
          cd libjaylink-${LIBJAYLINK_VER}
          ./autogen.sh
          echo "LIBJAYLINK_SRC=$PWD" >> $GITHUB_ENV
      - name: Prepare jimtcl
        env:
          JIMTCL_VER: 0.83
        run: |
          mkdir -p $DL_DIR && cd $DL_DIR
          wget https://github.com/msteveb/jimtcl/archive/refs/tags/${JIMTCL_VER}.tar.gz
          tar -xzf ${JIMTCL_VER}.tar.gz
          echo "JIMTCL_SRC=$PWD/jimtcl-${JIMTCL_VER}" >> $GITHUB_ENV
      - name: Prepare libyaml
        env:
          LIBYAML_VER: 0.2.5
        run: |
          mkdir -p $DL_DIR && cd $DL_DIR
          # The release tarball ships a pre-generated configure script and
          # config/config.guess, so no autoreconf run is needed here.  The
          # git tag archive would need ./bootstrap first.
          wget "https://github.com/yaml/libyaml/releases/download/${LIBYAML_VER}/yaml-${LIBYAML_VER}.tar.gz"
          tar -xzf yaml-${LIBYAML_VER}.tar.gz
          echo "LIBYAML_SRC=$PWD/yaml-${LIBYAML_VER}" >> $GITHUB_ENV
      - name: Prepare zlib
        env:
          ZLIB_VER: 1.3.1
        run: |
          mkdir -p $DL_DIR && cd $DL_DIR
          wget "https://github.com/madler/zlib/releases/download/v${ZLIB_VER}/zlib-${ZLIB_VER}.tar.gz"
          tar -xzf zlib-${ZLIB_VER}.tar.gz
          echo "ZLIB_SRC=$PWD/zlib-${ZLIB_VER}" >> $GITHUB_ENV
      - name: Package OpenOCD for windows
        env:
          MAKE_JOBS: 2
          HOST: x86_64-w64-mingw32
          LIBUSB1_CONFIG: --enable-shared --disable-static
          HIDAPI_CONFIG: --enable-shared --disable-static --disable-testgui
          LIBFTDI_CONFIG: -DSTATICLIBS=OFF -DEXAMPLES=OFF -DFTDI_EEPROM=OFF
          CAPSTONE_CONFIG: "CAPSTONE_BUILD_CORE_ONLY=yes CAPSTONE_STATIC=yes CAPSTONE_SHARED=no"
          LIBJAYLINK_CONFIG: --enable-shared --disable-static
          JIMTCL_CONFIG: --with-ext=json --minimal --disable-ssl
          LIBYAML_CONFIG: ""
        run: |
          # check if there is tag pointing at HEAD, otherwise take the HEAD SHA-1 as OPENOCD_TAG
          OPENOCD_TAG="`git tag --points-at HEAD`"
          [ -z $OPENOCD_TAG ] && OPENOCD_TAG="`git rev-parse --short HEAD`"
          # set env and call cross-build.sh
          export OPENOCD_TAG=$OPENOCD_TAG
          export OPENOCD_SRC=$PWD
          # Enable the adapters contributed by merged third-party forks.
          # Option names come from configure.ac's AC_ARG_ADAPTERS/
          # PROCESS_ADAPTERS macros, which m4_translit underscores to dashes,
          # so adi_ice1000 becomes --enable-adi-ice1000.
          # ADI_* need libusb-1.x; adi-usbmux only builds on Win32 hosts
          # (it is #ifdef _WIN32 throughout) and this job targets mingw.
          export OPENOCD_CONFIG="--enable-dirtyjtag --enable-adi-ice1000 --enable-adi-ice1500 --enable-adi-dbgagent --enable-adi-mpdbgagent --enable-adi-usbmux"
          mkdir -p $BUILD_DIR &&  cd $BUILD_DIR
          bash $OPENOCD_SRC/contrib/cross-build.sh $HOST
          # add missing dlls
          cd $HOST-root/usr
          cp `$HOST-gcc --print-file-name=libwinpthread-1.dll` ./bin/
          # required by libftdi1.dll
          cp `$HOST-gcc --print-file-name=libgcc_s_seh-1.dll` ./bin/
          # prepare the artifact
          ARTIFACT="openocd-${OPENOCD_TAG}-${HOST}.tar.gz"
          tar -czf $ARTIFACT *
          echo "ARTIFACT_PATH=$PWD/$ARTIFACT" >> $GITHUB_ENV
      - name: Publish OpenOCD packaged for windows
        uses: actions/upload-artifact@v4
        with:
          name: openocd-windows
          path: ${{ env.ARTIFACT_PATH }}

  # Upstream has no Linux job: its release only ever carried the Windows cross
  # build. This one builds natively with the runner's own x86_64 toolchain and
  # ships the same feature set, except for adi-usbmux - configure.ac guards that
  # adapter with "x$is_win32 = xyes" and aborts configure everywhere else.
  package-linux:
    runs-on: [ubuntu-latest]
    env:
      PREFIX: /opt/openocd
      # Not libjim-dev: the package would then depend on the distributor's
      # version and extension set. Built from the same tarball with the same
      # options as the mingw job, so both packages carry one jimtcl.
      JIMTCL_PREFIX: ${{ runner.temp }}/jimtcl-install
    steps:
      - name: Install needed packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autotools-dev autoconf automake libtool pkg-config texinfo \
            libusb-1.0-0-dev libhidapi-dev libftdi1-dev libjaylink-dev libyaml-dev \
            zlib1g-dev libcapstone-dev libgpiod-dev patchelf
      - name: Checkout Code
        uses: actions/checkout@v4
      - run: ./bootstrap
      - name: Build jimtcl with the extensions the windows package uses
        # Upstream would take jimtcl from the submodule through
        # --enable-internal-jimtcl, but this fork does not register that gitlink
        # in its index, so a checkout has an empty jimtcl/ directory. The
        # installed prefix is found through PKG_CONFIG_PATH instead.
        env:
          JIMTCL_VER: 0.83
        run: |
          mkdir -p $RUNNER_TEMP/dl && cd $RUNNER_TEMP/dl
          # -O: github.com redirects to codeload, whose last path element is the
          # version, so letting wget pick the name would write a file called 0.83.
          wget -O jimtcl-${JIMTCL_VER}.tar.gz "https://github.com/msteveb/jimtcl/archive/refs/tags/${JIMTCL_VER}.tar.gz"
          tar -xzf jimtcl-${JIMTCL_VER}.tar.gz
          cd jimtcl-${JIMTCL_VER}
          ./configure --prefix=$JIMTCL_PREFIX --with-ext=json --minimal --disable-ssl
          make -j $(nproc)
          make install
          echo "PKG_CONFIG_PATH=$JIMTCL_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> $GITHUB_ENV
      - name: Configure and build OpenOCD
        env:
          # Same adapter set as the windows package minus adi-usbmux; the
          # libgpiod/sysfsgpio adapters switch themselves on when their headers
          # are present, which they are.
          OPENOCD_CONFIG: --enable-dirtyjtag --enable-adi-ice1000 --enable-adi-ice1500 --enable-adi-dbgagent --enable-adi-mpdbgagent
        run: |
          ./configure $OPENOCD_CONFIG --prefix=$PREFIX
          make -j $(nproc)
      - name: Stage the install tree and bundle the runtime libraries
        run: |
          set -euo pipefail
          make install DESTDIR=$PWD/stage
          cd stage$PREFIX
          # The rpath is set after the install rather than through configure's
          # LDFLAGS: libtool re-evaluates the flags, so $ORIGIN survives at most
          # one escaping layer and the recorded RUNPATH came out as "RIGIN/../lib"
          # and then as "/../lib". patchelf takes the string verbatim, and without
          # the rpath the libraries copied below would never be found.
          patchelf --set-rpath '$ORIGIN/../lib' bin/openocd
          mkdir -p lib
          # Everything ldd resolves outside glibc travels with the package;
          # glibc and the loader stay the host's. libjim is only in the build
          # prefix, which is not in the runner's search path.
          LD_LIBRARY_PATH="$JIMTCL_PREFIX/lib" ldd bin/openocd > /tmp/ldd.txt
          cat /tmp/ldd.txt
          if grep -q "not found" /tmp/ldd.txt; then
            echo "the freshly staged binary already has unresolved libraries" >&2
            exit 1
          fi
          LD_LIBRARY_PATH="$JIMTCL_PREFIX/lib" ldd bin/openocd | awk '/=>/ {print $3}' | grep '^/' | while read lib; do
            case "$(basename "$lib")" in
              libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|ld-linux*) ;;
              *) cp -L "$lib" lib/ ;;
            esac
          done || true
          cp -L $JIMTCL_PREFIX/lib/libjim.so* lib/ 2>/dev/null || true
          # Without the rpath the copies above would never be found.
          readelf -d bin/openocd | grep -qiE '(runpath|rpath).*\$ORIGIN/\.\./lib' || {
            echo "openocd carries no \$ORIGIN/../lib rpath; the bundled libraries would be ignored" >&2
            readelf -d bin/openocd | grep -i 'path'
            exit 1
          }
          # And now the staged tree has to resolve everything by itself.
          ldd bin/openocd > /tmp/ldd-staged.txt
          cat /tmp/ldd-staged.txt
          if grep -q "not found" /tmp/ldd-staged.txt; then
            echo "the staged tree is not self-contained" >&2
            exit 1
          fi
      - name: Smoke-test the staged tree
        # The stm32h5x configuration is the regression this fork imported that
        # driver for: without it, sourcing the file aborts with "flash driver
        # 'stm32h5x' not found", so this is a real acceptance check rather than
        # a --version print. The dummy adapter stands in for a probe, which a
        # runner does not have.
        run: |
          set -euo pipefail
          P=$PWD/stage$PREFIX
          $P/bin/openocd --version
          run="$($P/bin/openocd -s $P/share/openocd/scripts -c "adapter driver dummy" -f target/stm32h5x.cfg -c shutdown 2>&1 || true)"
          printf '%s\n' "$run"
          case "$run" in
            *"flash driver 'stm32h5x' not found"*)
              echo "the staged openocd does not provide the stm32h5x driver" >&2
              exit 1 ;;
          esac
          printf '%s\n' "$run" | grep -q "shutdown command invoked"
          count=$(strings $P/bin/openocd | grep -c stm32h5x || true)
          echo "stm32h5x strings in the binary: $count"
          [ "$count" -gt 0 ]
      - name: Prepare the artifact
        run: |
          set -euo pipefail
          # check if there is tag pointing at HEAD, otherwise take the HEAD SHA-1 as OPENOCD_TAG
          OPENOCD_TAG="$(git tag --points-at HEAD)"
          if [ -z "$OPENOCD_TAG" ]; then OPENOCD_TAG="$(git rev-parse --short HEAD)"; fi
          HOST="$(gcc -dumpmachine)"
          ARTIFACT="openocd-${OPENOCD_TAG}-${HOST}.tar.gz"
          ARTIFACT_DIR=$PWD
          # Same layout as the windows package: bin/, lib/ and share/ at the root.
          ( cd "$ARTIFACT_DIR/stage$PREFIX" && tar -czf "$ARTIFACT_DIR/$ARTIFACT" . )
          echo "ARTIFACT_PATH=$ARTIFACT_DIR/$ARTIFACT" >> $GITHUB_ENV
      - name: Publish OpenOCD packaged for linux
        uses: actions/upload-artifact@v4
        with:
          name: openocd-linux
          path: ${{ env.ARTIFACT_PATH }}

  # The repository ships its own gates; run them here so a stale manifest or a
  # stale published number is a CI failure rather than a silent regression.
  gate:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install a TCL interpreter
        run: sudo apt-get update && sudo apt-get install -y tcl
      - name: Fetch the pinned upstream branch when it is reachable
        # sync_doc_numbers.py prefers the real upstream tree over the committed
        # index; without this step it falls back to manifest/upstream-index.txt,
        # which is fine but weaker. A network failure must not fail the gate.
        continue-on-error: true
        run: |
          git remote add upstream https://github.com/openocd-org/openocd.git
          git fetch --no-tags --depth 1 upstream master:refs/remotes/upstream/master
      - name: Verify the imported overlay against manifest/PROVENANCE.json
        run: python3 tools/verify_tree.py
      - name: Check every published number for drift
        run: python3 tools/sync_doc_numbers.py --check
      - name: Parse every shipped TCL configuration
        run: python3 tools/check_tcl_syntax.py
      - name: Check every flash bank driver name against the compiled NOR table
        # A config can source every file it names and still abort at run time
        # because the driver string it hands to `flash bank` was never imported
        # (stm32h5x did exactly that on 2026-10-25). File-level resolution is
        # audit_dangling_refs.py's job; this is name-level.
        run: python3 tools/audit_flash_drivers.py
      - name: Report dangling [find ...] references without failing on the known five
        run: python3 tools/audit_dangling_refs.py

  release:
    needs: [package, package-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [ubuntu-latest]
    permissions:
      contents: write
    steps:
      # Check out first: actions/checkout cleans untracked files by default, so a
      # checkout after the download would delete the artifact it just fetched.
      - name: Check out the tagged tree for the release notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          # No name: both packages are wanted, and each lands in dist/<artifact
          # name>/. Their file names already carry the target triplet.
          path: dist
      - name: Create or update the GitHub Release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          # This job starts in a fresh workspace, so name the repository
          # explicitly rather than relying on a git remote for discovery.
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist/*/
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A re-run of the same tag: replace the assets instead of failing.
            gh release upload "$GITHUB_REF_NAME" ./dist/*/openocd-*.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./dist/*/openocd-*.tar.gz \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes
          fi
      - name: Publish the changelog section as the release notes
        # --generate-notes only diffs against the previous tag, which is empty for
        # a first release, so replace the body with the CHANGELOG entry for this
        # version plus the checksum of the asset that was just attached. A missing
        # CHANGELOG section is a hard failure: a release without notes is worse
        # than a red job.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          awk -v ver="$GITHUB_REF_NAME" '
            $0 == "## " ver { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 3 }
          ' CHANGELOG.md > /tmp/changelog-section.md
          {
            echo "Windows x86_64 (mingw-w64) cross build and native Linux x86_64 build, produced by the package jobs of this tag."
            echo
            cat /tmp/changelog-section.md
            echo
            echo "### Assets"
            echo
            echo '```'
            ls -l ./dist/*/openocd-*.tar.gz
            sha256sum ./dist/*/openocd-*.tar.gz
            echo '```'
            echo
            echo "Release process and post-release checks: docs/04-release.md."
          } > /tmp/notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
